[workspace]
resolver = "2"
members = [
  "ntex",
  "ntex-bytes",
  "ntex-codec",
  "ntex-dispatcher",
  "ntex-error",
  "ntex-http",
  "ntex-io",
  "ntex-macros",
  "ntex-router",
  "ntex-rt",
  "ntex-net",
  "ntex-server",
  "ntex-service",
  "ntex-tls",
  "ntex-util",
  "urly",
]

[workspace.lints.rust]
async_fn_in_trait = { level = "allow", priority = -1 }
unknown_lints = { level = "allow", priority = -1 }
rust_2018_idioms = "deny"
warnings = "deny"
unreachable_pub = "deny"
missing_debug_implementations = "deny"

unexpected_cfgs = { level = "warn", priority = -2, check-cfg = ['cfg(docsrs_dep)'] }

[patch.crates-io]
ntex = { path = "ntex" }
ntex-bytes = { path = "ntex-bytes" }
ntex-codec = { path = "ntex-codec" }
ntex-error = { path = "ntex-error" }
ntex-io = { path = "ntex-io" }
ntex-dispatcher = { path = "ntex-dispatcher" }
ntex-net = { path = "ntex-net" }
ntex-http = { path = "ntex-http" }
ntex-router = { path = "ntex-router" }
ntex-rt = { path = "ntex-rt" }
ntex-server = { path = "ntex-server" }
ntex-service = { path = "ntex-service" }
ntex-tls = { path = "ntex-tls" }
ntex-macros = { path = "ntex-macros" }
ntex-util = { path = "ntex-util" }
urly = { path = "urly" }

[workspace.dependencies]
ntex = "4.0.0-beta.15"
ntex-bytes = "1.10.0"
ntex-codec = "2.0.0"
ntex-dispatcher = "4.2.0"
ntex-error = "3.0.0"
ntex-h2 = "4.1.0"
ntex-http = "1.3.0"
ntex-io = "4.1.0"
ntex-macros = "4.0.0"
ntex-net = "4.1.1"
ntex-router = "2.0.0"
ntex-rt = "4.1.0"
ntex-server = "4.2.0"
ntex-service = "5.1.0"
ntex-tls = "4.1.0"
ntex-util = "4.2.1"

ntex-io-uring = "0.8.7150"
ntex-httparse = "2.2.0"
ntex-polling = "4.0.0"

async-channel = "2"
async-task = "4.5.0"
atomic-waker = "1.1"
atoi_simd = "0.18.1"
backtrace = "0.3.76"
bytes = "1.11.0"
bincode = "1.3.3"
base64 = "0.22"
coo-kie = { version = "0.18", package = "cookie" }
core_affinity = "0.8"
bitflags = "2"
cfg-if = "1.0.0"
crossbeam-channel = "0.5.8"
crossbeam-queue = "0.3.8"
ctrlc = "3.4"
derive_more = "2.0.1"
encoding_rs = "0.8"
env_logger = { version = "0.11", default-features = false }
flate2 = "1.0"
foldhash = "0.2.0"
futures = "0.3.33"
futures-core = { version = "0.3.33", default-features = false, features = ["alloc"] }
futures-util = { version = "0.3.33", default-features = false, features = ["alloc"] }
futures-timer = "3.0"
hashbrown = { version = "0.17.1", features = ["serde"] }
http = "1.5.0"
httparse = "1.10.1"
httpdate = "1.0"
itoa = "1.0.18"
libc = "0.2.189"
log = "0.4"
mime = "0.3"
nix = "0.31.3"
oneshot = { version = "0.2.1", features = ["std", "async"] }
tls_openssl = { version = "0.10", package = "openssl" }
openssl-sys = "0.9"
foreign-types-shared = "0.1"
parking_lot = "0.12.5"
percent-encoding = "2.3"
polling = "3.11.0"
pin-project-lite = "0.2"
proc-macro2 = "1.0.105"
quote = "1.0.43"
rand = "0.9"
regex = { version = "1.11", default-features = false, features = ["std"] }
rustls-pemfile = "2"
tls_rustls = { version = "0.23", package = "rustls", default-features = false }
nanorand = { version = "0.8", default-features = false, features = [
    "std",
    "wyrand",
    "entropy",
    "tls"
] }
scoped-tls = "1.0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_test = "1.0"
serde_derive = "1.0"
serde_urlencoded = "0.7"
signal-hook = "0.4.4"
simdutf8 = "0.1.5"
slab = "0.4.9"
socket2 = "0.6.1"
swap-buffer-queue = "0.2.1"
syn = "3.0"
variadics_please = "1.1"
windows-sys = "0.61.0"
time = "0.3.54"
thiserror = "2"
tok-io = { version = "1", package = "tokio", default-features = false }
webpki-roots = "1.0"
url-pkg = { version = "2.5.2", package = "url" }
uuid = { version = "1.19", features = ["v7"] }

compio-buf = "0.8.3"
compio-io = "0.10.1"
compio-net = "0.12.2"
compio-driver = "0.12.4"
compio-runtime = "0.12.3"
