[package]
name = "ntex-io"
version = "4.7.2"
authors = ["ntex contributors <team@ntex.rs>"]
description = "Utilities for abstracting io streams"
keywords = ["network", "framework", "async", "futures"]
homepage = "https://ntex.rs"
repository = "https://github.com/ntex-rs/ntex.git"
documentation = "https://docs.rs/ntex-io/"
categories = ["network-programming", "asynchronous"]
license = "MIT OR Apache-2.0"
edition = "2024"
rust-version = "1.97"

[package.metadata.docs.rs]
features = ["tracker", "tokio"]
rustdoc-args = ["--cfg", "docsrs"]

[lib]
name = "ntex_io"
path = "src/lib.rs"

[lints]
workspace = true

[features]
default = []
trace = []

# read buffer memory attribution
tracker = ["ntex-bytes/tracker"]

# tokio `AsyncRead`/`AsyncWrite` for `Io` and `IoBoxed`
tokio = ["dep:tok-io"]

[dependencies]
ntex-codec = { workspace = true }
ntex-bytes = { workspace = true }
ntex-util = { workspace = true }
ntex-service = { workspace = true }
ntex-rt = { workspace = true }

bitflags = { workspace = true }
log = { workspace = true }
pin-project-lite = { workspace = true }
slab = { workspace = true }

tok-io = { workspace = true, optional = true }

[dev-dependencies]
ntex = { workspace = true }
rand = { workspace = true }
tok-io = { workspace = true, features = ["io-util"] }
