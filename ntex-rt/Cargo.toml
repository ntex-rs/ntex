[package]
name = "ntex-rt"
version = "4.4.0"
authors = ["ntex contributors <team@ntex.rs>"]
description = "ntex runtime"
keywords = ["network", "framework", "async", "futures"]
homepage = "https://ntex.rs"
repository = "https://github.com/ntex-rs/ntex.git"
documentation = "https://docs.rs/ntex-rt/"
categories = ["network-programming", "asynchronous"]
license = "MIT OR Apache-2.0"
build = "build.rs"
edition = "2024"
rust-version = "1.97"

[lib]
name = "ntex_rt"
path = "src/lib.rs"

[lints]
workspace = true

[features]
default = []

# tokio support
tokio = ["tok-io"]

# compio support
compio = ["compio-driver", "compio-runtime"]

[dependencies]
ntex-error = { workspace = true }

atomic-waker = { workspace = true }
async-channel = { workspace = true }
backtrace = { workspace = true }
crossbeam-channel = { workspace = true }
foldhash = { workspace = true }
futures-timer = { workspace = true }
libc = { workspace = true }
log = { workspace = true }
nix = { workspace = true, features = ["signal"] }
oneshot = { workspace = true }
parking_lot = { workspace = true }
scoped-tls = { workspace = true }

compio-driver = { workspace = true, optional = true }
compio-runtime = { workspace = true, optional = true }
tok-io = { workspace = true, features = ["rt", "net"], optional = true }

[target.'cfg(target_family = "unix")'.dependencies]
signal-hook = { workspace = true }

[target.'cfg(target_family = "windows")'.dependencies]
ctrlc = { workspace = true }
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Kernel",
    "Win32_System_Threading",
] }

# loom models of the runtime task, `RUSTFLAGS="--cfg ntex_loom"`
[target.'cfg(ntex_loom)'.dependencies]
loom = "0.7"

[dev-dependencies]
ntex = { workspace = true }
