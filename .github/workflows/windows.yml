name: CI (Windows)

on:
  push:
    branches:
      - main
    tags:
      - '**'
  pull_request:

env:
  VCPKGRS_DYNAMIC: 1

jobs:
  build_and_test:
    strategy:
      fail-fast: false
      matrix:
        version:
          - stable
          - nightly

    name: ${{ matrix.version }} - x86_64-pc-windows-msvc
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v6
      - uses: taiki-e/install-action@nextest

      - name: Install ${{ matrix.version }}
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: ${{ matrix.version }}-x86_64-pc-windows-msvc

      - name: Generate Cargo.lock
        uses: actions-rs/cargo@v1
        with:
          command: generate-lockfile

      - name: Cache Dependencies
        uses: Swatinem/rust-cache@v2.8.2

      - name: Cache vcpkg
        uses: actions/cache@v5
        with:
          path: C:\vcpkg\installed\
          key: x86_64-pc-windows-msvc-openssl

      - name: Cache cargo registry
        uses: actions/cache@v5
        with:
          path: ~/.cargo/registry
          key: ${{ matrix.version }}-x86_64-pc-windows-msvc-cargo-registry-trimmed-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo index
        uses: actions/cache@v5
        with:
          path: ~/.cargo/git
          key: ${{ matrix.version }}-x86_64-pc-windows-msvc-cargo-index-trimmed-${{ hashFiles('**/Cargo.lock') }}

      - name: Install cmake
        uses: lukka/get-cmake@latest

      - name: Install nasm
        uses: ilammy/setup-nasm@v1

      - name: Cache openssl
        uses: actions/cache@v5
        with:
          path: C:\vcpkg\installed\x64-windows\
          key: x86_64-openssl

      - name: Install OpenSSL
        run: |
          $env:VCPKG_MANIFEST_MODE = 'OFF'
          vcpkg integrate install
          vcpkg install --clean-after-build openssl:x64-windows
          Copy-Item C:\vcpkg\installed\x64-windows\bin\libcrypto-3-x64.dll C:\vcpkg\installed\x64-windows\bin\libcrypto.dll
          Copy-Item C:\vcpkg\installed\x64-windows\bin\libssl-3-x64.dll C:\vcpkg\installed\x64-windows\bin\libssl.dll
          Get-ChildItem C:\vcpkg\installed\x64-windows\bin
          Get-ChildItem C:\vcpkg\installed\x64-windows\lib

      - name: Install SymCrypt
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP "symcrypt.zip"
          $symcrypt = Join-Path $env:RUNNER_TEMP "symcrypt"
          Invoke-WebRequest -Uri "https://github.com/microsoft/SymCrypt/releases/download/v103.13.0/symcrypt-windows-amd64-release-103.13.0-286762b7.zip" -OutFile $archive
          $expected = "90ea7631331d23a43e0abc7f7af89b44bda67cfa183a70a8b76d988d9d3036b8"
          if ((Get-FileHash -Path $archive -Algorithm SHA256).Hash -ne $expected) {
            throw "SymCrypt archive checksum mismatch"
          }
          Expand-Archive -Path $archive -DestinationPath $symcrypt
          $lib = Join-Path $symcrypt "dll"
          "SYMCRYPT_LIB_PATH=$lib" >> $env:GITHUB_ENV
          $lib >> $env:GITHUB_PATH

      - name: Clippy (neon)
        if: matrix.version == 'stable'
        run: |
          cargo clippy --all --no-default-features --features="ntex/cookie,ntex/compress,ntex/openssl,ntex/rustls,ntex/ws"

      - name: Run tests (neon)
        timeout-minutes: 10
        run: |
          cargo nextest run --retries=3 --all --no-default-features --no-fail-fast --features="ntex/cookie,ntex/compress,ntex/openssl,ntex/rustls,ntex/ws"

      - name: Run tests (tokio)
        timeout-minutes: 10
        run: |
          cargo nextest run --retries=3 --all --no-default-features --no-fail-fast --features="ntex/tokio,ntex/cookie,ntex/compress,ntex/openssl,ntex/rustls,ntex/ws"

      - name: Run tests (compio)
        if: matrix.version == 'stable'
        timeout-minutes: 10
        run: |
          cargo nextest run --retries=3 --all --no-default-features --no-fail-fast --features="ntex/compio,ntex/cookie,ntex/compress,ntex/openssl,ntex/rustls,ntex/ws"
