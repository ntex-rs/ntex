name: Docs

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - name: Cache cargo registry
        uses: Swatinem/rust-cache@v2.8.2
        with:
          cache-on-failure: true

      - name: Build docs
        run:
          cargo doc --no-deps --workspace --no-default-features --features="ntex/tokio,ntex/openssl,ntex/rustls,ntex/compress,ntex/cookie,ntex/ws,ntex-tls/rustls-ring"

      - name: Install mdBook
        uses: taiki-e/install-action@v2
        with:
          tool: mdbook

      - name: Build guide
        run: |
          mkdir -p target/guide-src
          cp docs/*.md docs/book.toml target/guide-src/
          sed 's|](docs/|](./|g' ntex/migration_3to4.md > target/guide-src/migration_3to4.md
          sed -i 's|](../ntex/migration_3to4.md)|](./migration_3to4.md)|' target/guide-src/index.md
          mdbook build target/guide-src -d "$PWD/_site"
          rm -f _site/book.toml

      - name: Add API docs
        run: |
          rm -f target/doc/.lock
          cp -r target/doc _site/api
          cat > _site/api/index.html <<'EOF'
          <!DOCTYPE html>
          <meta charset="utf-8">
          <title>ntex API documentation</title>
          <meta http-equiv="refresh" content="0; url=ntex/index.html">
          <link rel="canonical" href="ntex/index.html">
          <p>Redirecting to <a href="ntex/index.html">ntex api documentation</a>.</p>
          EOF

      - name: Upload pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
