name: Miri

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  miri:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: taiki-e/install-action@nextest

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          profile: minimal
          # Miri requires nightly Rust
          toolchain: nightly
          override: true
          components: miri rust-src

      - name: Generate Cargo.lock
        uses: actions-rs/cargo@v1
        with:
          command: generate-lockfile

      - name: Clean
        run: cargo clean

      - name: Cache Dependencies
        uses: Swatinem/rust-cache@v2.8.2

      - name: Run Miri (bytes)
        # Run all of your tests inside of Miri interpreter
        run: cargo miri nextest run -p ntex-bytes

      - name: Run Miri (bytes, tracker)
        run: cargo miri nextest run -p ntex-bytes --features tracker

      - name: Run Miri (bytes, big-endian)
        continue-on-error: true
        run: cargo miri nextest run -p ntex-bytes --target s390x-unknown-linux-gnu

      - name: Run Miri (ntex-service::cfg)
        # Run all of your tests inside of Miri interpreter
        run: cargo miri nextest run -p ntex-service -- "cfg::tests::"

      - name: Run Miri (ntex-service::pipeline)
        # Pipelines are self-referential, which Stacked Borrows rejects
        env:
          MIRIFLAGS: -Zmiri-disable-stacked-borrows
        run: cargo miri nextest run -p ntex-service -- "miri_"

      - name: Run Miri (ntex::web handler futures, request pool)
        run: cargo miri nextest run -p ntex --lib -- "web::handler::tests::" "web::config::tests::miri_"

      - name: Run Miri (ntex ws mask, h1 codec)
        # Runtime tests need an I/O driver; the skipped decoder tests take minutes under Miri.
        run: >-
          cargo miri nextest run -p ntex --lib --
          "ws::mask::" "h1::encoder::tests::" "h1::decoder::tests::"
          --skip test_request_without_date
          --skip test_request_stream_framing
          --skip test_small_chunks_are_merged
          --skip test_chunked_trailers_limit
          --skip test_chunk_size_line_byte_by_byte

      - name: Run Miri (ntex-http header values)
        run: cargo miri nextest run -p ntex-http -- "value::"

      - name: Run Miri (ntex-util)
        run: cargo miri nextest run -p ntex-util -- "miri_"

      - name: Run Miri (urly)
        run: cargo miri nextest run -p urly

      - name: Run Miri (ntex-io)
        # Run all of your tests inside of Miri interpreter
        run: cargo miri nextest run -p ntex-io -- "miri_"

      - name: Run Miri (ntex-rt core reclamation)
        # Keep leak detection for serviced-runtime reclamation and owner releases.
        env:
          MIRIFLAGS: -Zmiri-disable-isolation -Zmiri-many-seeds=0..8
        run: >-
          cargo miri nextest run -p ntex-rt --lib -- "rt::task::core_tests"
          --skip completed_wakers_retain_storage_but_not_the_driver
          --skip unregistered_clones_and_native_awaiters_are_inert

      - name: Run Miri (ntex-rt runtime task)
        # Shutdown intentionally retains allocations with outstanding standard wakers.
        # Normal reclamation is checked above and by explicit allocation assertions.
        env:
          MIRIFLAGS: -Zmiri-disable-isolation -Zmiri-ignore-leaks -Zmiri-many-seeds=0..8
        run: cargo miri nextest run -p ntex-rt --lib -- "rt::"

      - name: Run Miri (ntex-rt join and local wake handles)
        env:
          MIRIFLAGS: -Zmiri-disable-isolation -Zmiri-many-seeds=0..8
        run: |
          cargo miri nextest run -p ntex-rt --lib -- local_waker::tests
          cargo miri nextest run -p ntex-rt --lib -- local_handles_survive_runtime_shutdown
          cargo miri nextest run -p ntex-rt --lib -- remote_join_result_
          cargo miri nextest run -p ntex-rt --lib -- remote::tests

      - name: Run loom (ntex-rt runtime task)
        env:
          RUSTFLAGS: --cfg ntex_loom
        run: cargo nextest run --release -p ntex-rt --lib -- task_loom
